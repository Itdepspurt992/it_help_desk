{% extends 'base.html' %}{% block content %}<h2>إنشاء طلب دعم جديد</h2><div class="card" style="margin-top:18px"><div class="card-body"><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="form-grid"><div class="form-group full"><label class="label">العنوان</label><input class="form-control" name="title" maxlength="255" required></div><div class="form-group full"><label class="label">الوصف</label><textarea class="form-control" name="description" rows="6" required></textarea></div><div class="form-group"><label class="label">القسم</label><select class="form-select" name="department_id" required>{% for d in departments %}<option value="{{d.id}}" {% if current_user.department_id==d.id %}selected{% endif %}>{{d.name}}</option>{% endfor %}</select></div><div class="form-group"><label class="label">التصنيف</label><select class="form-select" name="category_id" required>{% for c in categories %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></div><div class="form-group"><label class="label">الأولوية</label><select class="form-select" name="priority_id" required>{% for p in priorities %}<option value="{{p.id}}" {% if p.name=='Medium' %}selected{% endif %}>{{p.name}} — SLA {{p.sla_minutes}} دقيقة</option>{% endfor %}</select></div><div class="form-group"><label class="label">Asset / الجهاز</label><select class="form-select" name="asset_id"><option value="">بدون جهاز</option>{% for a in assets %}<option value="{{a.id}}">{{a.asset_code}} — {{a.device_type}}{% if a.serial_number %} — {{a.serial_number}}{% endif %}</option>{% endfor %}</select></div><div class="form-group full"><label class="label">المرفقات (حتى 10MB)</label><input class="form-control" type="file" name="attachments" multiple></div></div><button class="btn btn-primary">إرسال الطلب</button></form></div></div>{% endblock %}
