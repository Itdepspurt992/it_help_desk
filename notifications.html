{% extends 'base.html' %}{% block content %}<div class="actions" style="justify-content:space-between"><h2>الإشعارات</h2><form method="post" action="{{url_for('notifications_read_all')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn btn-outline">تحديد الكل كمقروء</button></form></div><div class="card" style="margin-top:18px"><div class="card-body">{% for n in notifications %}<div style="padding:14px 0;border-bottom:1px solid #eee"><a href="{{n.link or '#'}}">{{n.message}}</a><div class="muted">{{n.created_at.strftime('%Y-%m-%d %H:%M:%S')}}</div></div>{% else %}<div class="empty">لا توجد إشعارات</div>{% endfor %}</div></div>{% endblock %}
