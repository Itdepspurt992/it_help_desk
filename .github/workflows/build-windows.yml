name: Build IT Help Desk Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows application
        run: pyinstaller --clean --noconfirm IT_Help_Desk.spec

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build Setup EXE
        shell: powershell
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'installer\IT_Help_Desk.iss'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: IT_Help_Desk_Setup_Windows
          path: installer/output/IT_Help_Desk_Setup.exe
          if-no-files-found: error

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: IT_Help_Desk_Portable_Windows
          path: dist/IT_Help_Desk/
          if-no-files-found: error
