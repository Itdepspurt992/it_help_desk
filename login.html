<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول - IT Help Desk</title><link rel="stylesheet" href="{{url_for('static',filename='app.css')}}"></head><body><div class="login-page"><div class="login-box"><div class="hero"><div style="font-size:46px">🎧</div><h1>IT Help Desk</h1><p class="muted">نظام الدعم الفني الداخلي</p></div>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="alert alert-{{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="form-group"><label class="label">اسم المستخدم</label><input class="form-control" name="username" autocomplete="username" required autofocus></div><div class="form-group"><label class="label">كلمة المرور</label><input class="form-control" type="password" name="password" autocomplete="current-password" required></div><label style="display:flex;gap:8px;align-items:center;margin-bottom:18px"><input type="checkbox" name="remember"> تذكرني</label><button class="btn btn-primary btn-block">تسجيل الدخول</button></form></div></div></body></html>
